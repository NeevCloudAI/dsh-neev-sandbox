<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="NeevSandbox for DeepSeek Harness — run your agent's Bash, PTY and LSP in an isolated gVisor sandbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1110"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="14%" cy="8%" r="55%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="82%" cy="86%" r="55%">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f7f5"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="termshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#glowTL)"/>
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#glowBR)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="20" fill="none" stroke="#1b2420"/>

  <!-- typography -->
  <text x="80" y="150" font-size="14" letter-spacing="6" fill="#34d399" font-weight="600">NEEVCLOUD × DEEPSEEK HARNESS</text>
  <text x="76" y="232" font-size="76" font-weight="800" letter-spacing="1" fill="url(#titleg)">NeevSandbox</text>
  <text x="80" y="278" font-size="24" fill="#d5e0db" font-weight="500">Run every command <tspan fill="#34d399" font-weight="700">isolated by gVisor.</tspan></text>
  <text x="80" y="311" font-size="16.5" fill="#8ba398">Bash, PTY, and LSP run in a disposable sandbox — nothing on your host.</text>
  <line x1="80" y1="384" x2="150" y2="384" stroke="#2f8f6b" stroke-width="1.5"/>
  <text x="164" y="389" font-size="14" letter-spacing="5" fill="#5aa588" font-weight="600">INTO THE SANDBOX</text>

  <!-- terminal window -->
  <g filter="url(#termshadow)">
    <rect x="748" y="96" width="388" height="248" rx="14" fill="#0a0f0d" stroke="#20302a"/>
    <rect x="748" y="96" width="388" height="38" rx="14" fill="#111917"/>
    <rect x="748" y="120" width="388" height="14" fill="#111917"/>
    <circle cx="772" cy="115" r="5.5" fill="#f87171"/>
    <circle cx="792" cy="115" r="5.5" fill="#fbbf24"/>
    <circle cx="812" cy="115" r="5.5" fill="#34d399"/>
    <text x="1120" y="120" text-anchor="end" font-size="12" fill="#5b6b64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dsh · headless</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <text x="770" y="172"><tspan fill="#34d399">agent@sandbox</tspan><tspan fill="#4b5a53">:</tspan><tspan fill="#6ee7b7">~</tspan><tspan fill="#4b5a53">$ </tspan><tspan fill="#e5eeea">whoami</tspan></text>
    <text x="770" y="196" fill="#a7f3d0">agent</text>
    <text x="770" y="228"><tspan fill="#34d399">agent@sandbox</tspan><tspan fill="#4b5a53">:</tspan><tspan fill="#6ee7b7">~</tspan><tspan fill="#4b5a53">$ </tspan><tspan fill="#e5eeea">cat /etc/os-release</tspan></text>
    <text x="770" y="252" fill="#a7f3d0">Ubuntu 26.04 LTS</text>
    <text x="770" y="300" fill="#5f7a70"># runs in the sandbox, not on your laptop</text>
    <text x="770" y="324"><tspan fill="#34d399">agent@sandbox</tspan><tspan fill="#4b5a53">:</tspan><tspan fill="#6ee7b7">~</tspan><tspan fill="#4b5a53">$ </tspan></text>
    <text x="908" y="324" fill="#e5eeea">▋<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></text>
  </g>
</svg>
