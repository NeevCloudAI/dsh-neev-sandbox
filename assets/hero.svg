<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="NeevSandbox for DeepSeek Harness — run your agent's shell, PTY, and LSP inside a remote sandbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131e36"/>
    </linearGradient>
    <linearGradient id="dsh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="470" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- header -->
  <text x="60" y="82" fill="#f8fafc" font-size="40" font-weight="700">NeevSandbox <tspan fill="#94a3b8" font-weight="500">for</tspan> DeepSeek Harness</text>
  <text x="60" y="120" fill="#94a3b8" font-size="20">Run your agent's Bash, PTY, and LSP inside a remote sandbox — no Harness fork.</text>

  <!-- chips -->
  <g font-size="13" fill="#cbd5e1">
    <rect x="60" y="140" width="118" height="26" rx="13" fill="#1e293b"/><text x="119" y="157" text-anchor="middle">TypeScript · ESM</text>
    <rect x="188" y="140" width="96" height="26" rx="13" fill="#1e293b"/><text x="236" y="157" text-anchor="middle">Node ≥ 22</text>
    <rect x="294" y="140" width="150" height="26" rx="13" fill="#1e293b"/><text x="369" y="157" text-anchor="middle">installable dsh bundle</text>
    <rect x="454" y="140" width="64" height="26" rx="13" fill="#1e293b"/><text x="486" y="157" text-anchor="middle">MIT</text>
  </g>

  <!-- flow -->
  <g>
    <!-- DSH -->
    <rect x="60" y="250" width="320" height="150" rx="16" fill="url(#dsh)"/>
    <text x="220" y="298" text-anchor="middle" fill="#eef2ff" font-size="22" font-weight="700">DeepSeek Harness</text>
    <text x="220" y="330" text-anchor="middle" fill="#c7d2fe" font-size="15">the agent + its tools</text>
    <g font-size="13" fill="#312e81">
      <rect x="96" y="350" width="66" height="26" rx="13" fill="#c7d2fe"/><text x="129" y="367" text-anchor="middle">Bash</text>
      <rect x="170" y="350" width="60" height="26" rx="13" fill="#c7d2fe"/><text x="200" y="367" text-anchor="middle">PTY</text>
      <rect x="238" y="350" width="60" height="26" rx="13" fill="#c7d2fe"/><text x="268" y="367" text-anchor="middle">LSP</text>
    </g>

    <!-- seam arrow 1 -->
    <text x="440" y="312" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="600">ctx.subprocess</text>
    <path d="M384 325 H496" stroke="url(#seam)" stroke-width="3" fill="none"/>
    <polygon points="496,319 510,325 496,331" fill="#2dd4bf"/>

    <!-- provider -->
    <rect x="514" y="250" width="320" height="150" rx="16" fill="url(#mid)"/>
    <text x="674" y="298" text-anchor="middle" fill="#f5f3ff" font-size="20" font-weight="700">@neevcloud/dsh-sandbox</text>
    <text x="674" y="330" text-anchor="middle" fill="#ddd6fe" font-size="15">runtime + subprocess providers</text>
    <text x="674" y="360" text-anchor="middle" fill="#c4b5fd" font-size="13">this package · one cordis.patch.yml</text>

    <!-- seam arrow 2 -->
    <text x="894" y="312" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="600">@neevcloud/sdk</text>
    <path d="M838 325 H950" stroke="url(#seam)" stroke-width="3" fill="none"/>
    <polygon points="950,319 964,325 950,331" fill="#2dd4bf"/>

    <!-- sandbox -->
    <rect x="968" y="250" width="172" height="150" rx="16" fill="url(#box)"/>
    <text x="1054" y="300" text-anchor="middle" fill="#ecfdf5" font-size="20" font-weight="700">NeevSandbox</text>
    <text x="1054" y="330" text-anchor="middle" fill="#99f6e4" font-size="14">remote microVM</text>
    <text x="1054" y="360" text-anchor="middle" fill="#5eead4" font-size="13">your code runs here</text>
  </g>

  <text x="60" y="440" fill="#64748b" font-size="14">Swap one provider and Bash, PTY, and LSP all move into the sandbox — the tools are unchanged.</text>
</svg>
