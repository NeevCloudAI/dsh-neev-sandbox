<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" width="840" height="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Terminal demo: a real quickstart run showing a command and files executing inside a NeevSandbox">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c110f"/><stop offset="1" stop-color="#080b0a"/>
    </linearGradient>
    <radialGradient id="tglow" cx="10%" cy="0%" r="60%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="tsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#tsh)">
    <rect x="12" y="12" width="816" height="348" rx="14" fill="url(#tbg)" stroke="#20302a"/>
    <rect x="12" y="12" width="816" height="348" rx="14" fill="url(#tglow)"/>
    <rect x="12" y="12" width="816" height="40" rx="14" fill="#111917"/>
    <rect x="12" y="38" width="816" height="14" fill="#111917"/>
    <circle cx="38" cy="32" r="6" fill="#f87171"/><circle cx="60" cy="32" r="6" fill="#fbbf24"/><circle cx="82" cy="32" r="6" fill="#34d399"/>
    <text x="420" y="37" text-anchor="middle" font-size="12.5" fill="#5b6b64">quickstart — one sandbox for files and Bash</text>
  </g>

  <g font-size="14.5">
    <text x="36" y="86"><tspan fill="#4b5a53">$ </tspan><tspan fill="#e5eeea">NEEV_API_KEY=… node examples/quickstart.mjs</tspan></text>

    <text x="36" y="124" fill="#5b6b64">NeevSandbox created: 01a01550-d6cd-7af6-9233-c245780c5e08</text>

    <text x="36" y="158" fill="#8ba398">the sandbox reports:</text>
    <text x="36" y="184" fill="#a7f3d0">PRETTY_NAME="Ubuntu 26.04 LTS"</text>
    <text x="36" y="210" fill="#a7f3d0">root</text>

    <text x="36" y="248"><tspan fill="#8ba398">Bash read the fs-written file: </tspan><tspan fill="#34d399">written by ctx.fs</tspan></text>

    <text x="36" y="286" fill="#5b6b64">NeevSandbox terminated: 01a01550-d6cd-7af6-9233-c245780c5e08</text>

    <text x="36" y="322"><tspan fill="#4b5a53">$ </tspan><tspan fill="#e5eeea">▋<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
